[project]
name = "aidos"
version = "0.1.0"
description = "Айдой — қазақ тілді AI көмекші (дауыс + мәтін)"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "transformers>=4.40.0",
    "edge-tts>=6.1.9",
    "piper-tts>=1.4.0",
    "pygame>=2.6.0",
    "yt-dlp>=2024.1.0",
    "requests>=2.32.0",
    "schedule>=1.2.0",
    "rich>=13.7.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "silero-vad>=6.2",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "grpcio-tools==1.84.0"]

[project.scripts]
aidos = "aidos.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["src/aidos/brain/gen"]

[tool.ruff.lint.per-file-ignores]
"src/aidos/agents/music_agent.py" = ["E402"]
"src/aidos/ui/app.py" = ["F821", "F841"]
